<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Josue Torrico Vasquez</title>
    <style>
        body {
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 32px;
        }

        p {
            font-size: 18px;
            color: #555;
            margin: 10px 0;
        }

        .highlight {
            font-weight: bold;
            color: #0077b6;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Diseño Web I</h1>
        <p><span class="highlight">Estudiante:</span> Josue Torrico Vasquez</p>
        <p><span class="highlight">Valoración:</span>Fila B</p>
    </div>
</body>
</html>
